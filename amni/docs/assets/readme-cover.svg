<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc">
<title id="title">AMNI — Technical support, with the full picture</title>
<desc id="desc">AMNI's custom mark on a dark teal background, with connected case-management, diagnostics, and knowledge-base panels.</desc>
