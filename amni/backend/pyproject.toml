[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amni-backend"
version = "0.1.0"
description = "AMNI support-platform database and backend foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.45,<3",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires AMNI_RUN_DB_TESTS=1 and local PostgreSQL"]
